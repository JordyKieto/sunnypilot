<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Navigation Recorder</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --fg: #15171a;
        --muted: #5e6673;
        --panel: #ffffff;
        --border: #d7dce2;
        --accent: #126e5c;
        --accent-fg: #ffffff;
        --danger: #a93434;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101214;
          --fg: #f2f4f5;
          --muted: #a8b0ba;
          --panel: #1a1d20;
          --border: #333940;
          --accent: #20a486;
          --accent-fg: #07100d;
          --danger: #ff8c8c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 28px;
        line-height: 1.1;
        font-weight: 700;
      }
      .sub {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 15px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .map-shell {
        padding: 0;
        overflow: hidden;
        position: relative;
      }
      .map-frame {
        width: 100%;
        height: 420px;
        border: 0;
        display: block;
        background: #cfd6de;
      }
      .map-meta {
        display: flex;
        gap: 8px 14px;
        flex-wrap: wrap;
        padding: 12px 16px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .map-meta span {
        white-space: nowrap;
      }
      .map-legend {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        max-width: calc(100% - 20px);
        padding: 8px 10px;
        border: 1px solid rgba(0, 0, 0, .18);
        border-radius: 6px;
        background: rgba(255, 255, 255, .92);
        color: #15171a;
        font-size: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .legend-dot {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
      }
      .origin-dot { background: #1d4ed8; }
      .destination-dot { background: #b91c1c; }
      .route-dot {
        width: 28px;
        height: 4px;
        border-radius: 999px;
        background: #126e5c;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
        margin: 0 0 6px;
      }
      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        padding: 10px 12px;
        font: inherit;
      }
      .field { margin-bottom: 14px; }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        color: var(--fg);
        font-size: 14px;
        font-weight: 500;
      }
      .check input {
        width: 18px;
        min-height: 18px;
      }
      .mini-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .mini-row button {
        width: auto;
        flex: 1 1 160px;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-weight: 750;
      }
      button:disabled {
        opacity: .55;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .error { color: var(--danger); }
      .ok { color: var(--accent); }
      .debug {
        max-height: 180px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Navigation Recorder</h1>
      <p class="sub">Enter a destination before driving. The route snapshot is saved once with the recording.</p>

      <section class="map-shell">
        <div class="map-legend" id="mapLegend" aria-label="Map legend">
          <span class="legend-item"><span class="legend-dot origin-dot">O</span>Origin</span>
          <span class="legend-item"><span class="legend-dot destination-dot">D</span>Destination</span>
          <span class="legend-item"><span class="route-dot"></span>Route</span>
        </div>
        <div id="routeMap" class="map-frame" aria-label="Planned route map"></div>
        <div class="map-meta" id="mapMeta">
          <span>Map not ready</span>
        </div>
      </section>

      <section>
        <div class="field">
          <label for="apiKey">Google Maps API key</label>
          <input id="apiKey" name="apiKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza...">
        </div>
        <button id="saveKey" type="button">Save API Key</button>
      </section>

      <section>
        <div class="field">
          <label for="destination">Destination</label>
          <input id="destination" name="destination" autocomplete="street-address" placeholder="123 Main St, Los Angeles, CA">
        </div>
        <div class="field">
          <label for="origin">Origin override</label>
          <input id="origin" name="origin" autocomplete="street-address" placeholder="Leave blank to use device GPS">
        </div>
        <div class="row field">
          <label class="check"><input id="avoidTolls" type="checkbox">Avoid tolls</label>
          <label class="check"><input id="avoidHighways" type="checkbox">Avoid highways</label>
          <label class="check"><input id="avoidFerries" type="checkbox">Avoid ferries</label>
        </div>
        <div class="mini-row">
          <button id="start" type="button">Plan Route for Recording</button>
          <button id="clearNav" type="button">Clear Pending Nav</button>
        </div>
      </section>

      <section>
        <pre id="status">Loading status...</pre>
      </section>

      <section>
        <label>Debug log</label>
        <pre id="debugLog" class="debug">Starting...</pre>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");
      const debugLogEl = $("debugLog");
      const routeMapEl = $("routeMap");
      const mapMetaEl = $("mapMeta");
      const buttons = [$("saveKey"), $("start"), $("clearNav")];
      const MAP_REFRESH_MS = 15000;
      const DEFAULT_CENTER = {lat: 37.7749, lng: -122.4194};
      const DEBUG_LIMIT = 80;
      let lastStatus = null;
      let debugLines = [];
      let map = null;
      let destinationMarker = null;
      let currentMarker = null;
      let routeLine = null;
      let markerInfoWindow = null;
      let previewTimer = null;
      let previewRequestId = 0;
      let lastPreviewKey = "";
      let mapReady = false;
      let googleMapsPromise = null;
      let googleMapsLoadedKey = "";
      let googleMapsResolve = null;
      let googleMapsReject = null;

      function safeJson(value) {
        if (value instanceof Error) {
          return JSON.stringify({name: value.name, message: value.message, stack: value.stack});
        }
        try {
          return JSON.stringify(value);
        } catch {
          return String(value);
        }
      }

      function debug(message, context = null, level = "info") {
        const line = `${new Date().toLocaleTimeString()} ${level.toUpperCase()} ${message}${context ? " " + safeJson(context) : ""}`;
        debugLines.push(line);
        debugLines = debugLines.slice(-DEBUG_LIMIT);
        debugLogEl.textContent = debugLines.join("\n");
        const logFn = level === "error" ? console.error : level === "warning" ? console.warn : console.log;
        logFn("[navrecorder]", message, context || "");
        fetch("/client_log", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({level, message, context}),
        }).catch(() => {});
      }

      function setMapMeta(message) {
        mapMetaEl.innerHTML = `<span>${message}</span>`;
      }

      function setBusy(busy) {
        buttons.forEach((button) => button.disabled = busy);
      }

      function show(value, ok = true) {
        statusEl.className = ok ? "ok" : "error";
        statusEl.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      function decodePolyline(encoded) {
        const points = [];
        let index = 0;
        let lat = 0;
        let lng = 0;
        while (index < encoded.length) {
          let result = 0;
          let shift = 0;
          let b;
          do {
            b = encoded.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20);
          const dlat = result & 1 ? ~(result >> 1) : result >> 1;
          lat += dlat;
          result = 0;
          shift = 0;
          do {
            b = encoded.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20);
          const dlng = result & 1 ? ~(result >> 1) : result >> 1;
          lng += dlng;
          points.push({lat: lat / 1e5, lng: lng / 1e5});
        }
        return points;
      }

      function pointText(point) {
        return `${point.latitude.toFixed(5)}, ${point.longitude.toFixed(5)}`;
      }

      function parseDestination(value) {
        const raw = String(value || "").trim();
        const point = parseLatLngText(raw);
        if (point) {
          return {latitude: point.lat, longitude: point.lng};
        }
        return raw || null;
      }

      function parseLatLngText(value) {
        const raw = String(value || "").trim();
        const match = raw.match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);
        if (!match) {
          return null;
        }
        const lat = Number(match[1]);
        const lng = Number(match[2]);
        return Number.isFinite(lat) && Number.isFinite(lng) ? {lat, lng} : null;
      }

      function toLatLng(point) {
        if (!point || typeof point.latitude !== "number" || typeof point.longitude !== "number") {
          return null;
        }
        return {lat: point.latitude, lng: point.longitude};
      }

      function waypointLatLng(waypoint) {
        const latLng = waypoint?.location?.latLng;
        if (!latLng || typeof latLng.latitude !== "number" || typeof latLng.longitude !== "number") {
          return null;
        }
        return {lat: latLng.latitude, lng: latLng.longitude};
      }

      function markerPosition(marker) {
        const position = marker?.getPosition?.();
        return position ? {lat: position.lat(), lng: position.lng()} : null;
      }

      function markerIcon(kind) {
        const isOrigin = kind === "origin";
        return {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 12,
          fillColor: isOrigin ? "#1d4ed8" : "#b91c1c",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 3,
        };
      }

      function markerLabel(kind) {
        return {
          text: kind === "origin" ? "O" : "D",
          color: "#ffffff",
          fontSize: "12px",
          fontWeight: "800",
        };
      }

      function describePoint(point) {
        if (!point) {
          return "unknown";
        }
        const lat = typeof point.lat === "function" ? point.lat() : point.lat;
        const lng = typeof point.lng === "function" ? point.lng() : point.lng;
        return Number.isFinite(lat) && Number.isFinite(lng) ? `${lat.toFixed(6)}, ${lng.toFixed(6)}` : "unknown";
      }

      function applyMarkerInfo(marker, title, detail) {
        marker.navRecorderInfo = {title, detail};
        marker.setTitle(`${title}: ${detail}`);
        if (!marker.navRecorderHoverReady) {
          marker.addListener("mouseover", () => {
            const info = marker.navRecorderInfo || {title, detail};
            markerInfoWindow.setContent(`<strong>${info.title}</strong><br>${info.detail}`);
            markerInfoWindow.open({map, anchor: marker});
          });
          marker.addListener("mouseout", () => markerInfoWindow.close());
          marker.navRecorderHoverReady = true;
        }
      }

      function makeEndpointMarker(kind, position, draggable = false) {
        const title = kind === "origin" ? "Origin" : "Destination";
        const marker = new google.maps.Marker({
          position,
          map,
          draggable,
          title: `${title}: ${describePoint(position)}`,
          icon: markerIcon(kind),
          label: markerLabel(kind),
        });
        applyMarkerInfo(marker, title, describePoint(position));
        return marker;
      }

      function updateEndpointMarker(marker, kind, position) {
        marker.setPosition(position);
        marker.setIcon(markerIcon(kind));
        marker.setLabel(markerLabel(kind));
        applyMarkerInfo(marker, kind === "origin" ? "Origin" : "Destination", describePoint(position));
      }

      window.__navRecorderGoogleMapsLoaded = () => {
        debug("Google Maps JavaScript API loaded");
        googleMapsResolve?.();
      };

      window.gm_authFailure = () => {
        const message = "Google Maps authentication failed. Check that the key allows Maps JavaScript API for this page.";
        debug(message, null, "error");
        setMapMeta(message);
        googleMapsReject?.(new Error(message));
      };

      function loadGoogleMaps(apiKey) {
        const key = String(apiKey || "").trim();
        if (window.google?.maps) {
          ensureMap();
          return Promise.resolve();
        }
        if (!key) {
          const message = "Save a Google Maps API key to load the map.";
          setMapMeta(message);
          debug(message, null, "warning");
          return Promise.reject(new Error(message));
        }
        if (googleMapsPromise && googleMapsLoadedKey === key) {
          return googleMapsPromise;
        }

        document.getElementById("googleMapsScript")?.remove();
        googleMapsLoadedKey = key;
        googleMapsPromise = new Promise((resolve, reject) => {
          googleMapsResolve = resolve;
          googleMapsReject = reject;
          const script = document.createElement("script");
          script.id = "googleMapsScript";
          script.async = true;
          script.defer = true;
          script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly&callback=__navRecorderGoogleMapsLoaded`;
          script.onerror = () => {
            const message = "Google Maps JavaScript API script failed to load.";
            debug(message, {src: script.src.replace(key, "***")}, "error");
            setMapMeta(message);
            reject(new Error(message));
          };
          debug("Loading Google Maps JavaScript API");
          document.head.appendChild(script);
        }).then(() => {
          ensureMap();
          updateMap(lastStatus);
        }).catch((e) => {
          googleMapsPromise = null;
          throw e;
        });
        return googleMapsPromise;
      }

      function ensureMap() {
        if (mapReady) {
          return;
        }
        if (!window.google?.maps) {
          setMapMeta("Save API key to load Google Maps.");
          return;
        }
        const currentGps = toLatLng(lastStatus?.currentGps);
        map = new google.maps.Map(routeMapEl, {
          center: currentGps || DEFAULT_CENTER,
          zoom: currentGps ? 16 : 11,
          mapTypeControl: false,
          streetViewControl: false,
          fullscreenControl: true,
        });
        markerInfoWindow = new google.maps.InfoWindow();
        map.addListener("click", (event) => {
          if (destinationMarker) {
            destinationMarker.setPosition(event.latLng);
            updateEndpointMarker(destinationMarker, "destination", markerPosition(destinationMarker));
          } else {
            destinationMarker = makeEndpointMarker("destination", event.latLng, true);
            destinationMarker.addListener("dragend", updateDestinationField);
          }
          updateDestinationField();
          show(`Destination set to ${event.latLng.lat().toFixed(6)}, ${event.latLng.lng().toFixed(6)}`, true);
          debug("Destination selected on map", {lat: event.latLng.lat(), lng: event.latLng.lng()});
        });
        mapReady = true;
        debug("Map initialized");
        setMapMeta("Map ready. Click the map or enter a destination.");
      }

      function updateDestinationField() {
        if (!destinationMarker) {
          return;
        }
        const position = markerPosition(destinationMarker);
        if (!position) {
          return;
        }
        $("destination").value = `${position.lat.toFixed(6)},${position.lng.toFixed(6)}`;
        schedulePreviewRoute();
      }

      function fitMap(points) {
        if (!map || !points.length) {
          return;
        }
        const bounds = new google.maps.LatLngBounds();
        points.forEach((point) => bounds.extend(point));
        map.fitBounds(bounds, 48);
      }

      function clearRouteOverlay() {
        if (routeLine) {
          routeLine.setMap(null);
          routeLine = null;
        }
      }

      function clearPreviewRoute() {
        clearRouteOverlay();
        lastPreviewKey = "";
      }

      function renderEncodedRoute(encodedPolyline, resetPreviewKey = true) {
        clearRouteOverlay();
        if (resetPreviewKey) {
          lastPreviewKey = "";
        }
        const routePoints = decodePolyline(encodedPolyline);
        routeLine = new google.maps.Polyline({
          path: routePoints,
          geodesic: true,
          strokeColor: "#126e5c",
          strokeOpacity: 0.9,
          strokeWeight: 5,
          map,
        });
        const originPoint = routePoints[0];
        const destinationPoint = routePoints[routePoints.length - 1];
        if (originPoint) {
          if (currentMarker) {
            updateEndpointMarker(currentMarker, "origin", originPoint);
          } else {
            currentMarker = makeEndpointMarker("origin", originPoint);
          }
        }
        if (destinationPoint) {
          if (destinationMarker) {
            updateEndpointMarker(destinationMarker, "destination", destinationPoint);
          } else {
            destinationMarker = makeEndpointMarker("destination", destinationPoint, true);
            destinationMarker.addListener("dragend", updateDestinationField);
          }
        }
        fitMap(routeLine.getPath().getArray());
      }

      async function previewRoute() {
        if (!map) {
          return;
        }

        const origin = $("origin").value.trim() || null;
        const destination = parseDestination($("destination").value);
        if (!destination) {
          clearPreviewRoute();
          setMapMeta("Map ready. Click the map or enter a destination.");
          return;
        }
        if (!origin && !lastStatus?.currentGps) {
          debug("Route preview skipped: enter an origin override or wait for current GPS", null, "warning");
          setMapMeta("Enter an origin override or wait for current GPS to preview the route.");
          return;
        }

        const requestBody = {
          apiKey: $("apiKey").value.trim() || null,
          origin,
          destination,
          avoid: {
            tolls: $("avoidTolls").checked,
            highways: $("avoidHighways").checked,
            ferries: $("avoidFerries").checked,
          },
        };
        const previewKey = safeJson(requestBody);
        if (previewKey === lastPreviewKey) {
          return;
        }
        lastPreviewKey = previewKey;
        const requestId = ++previewRequestId;
        clearRouteOverlay();
        debug("Requesting route preview", {
          originType: origin ? "manual" : "currentGps",
          destinationType: typeof destination === "string" ? "address" : "latLng",
        });

        try {
          const body = await request("/preview_route", {
            method: "POST",
            body: JSON.stringify(requestBody),
          });
          if (requestId !== previewRequestId) {
            return;
          }
          if (!body.encodedPolyline) {
            clearPreviewRoute();
            debug("Route preview failed: response missing polyline", body, "warning");
            setMapMeta("Route preview failed: missing route polyline");
            return;
          }
          renderEncodedRoute(body.encodedPolyline, false);
          debug("Route preview rendered", {
            distanceMeters: body.distanceMeters,
            duration: body.duration,
          });
          updateMapMeta();
        } catch (e) {
          if (requestId !== previewRequestId) {
            return;
          }
          clearPreviewRoute();
          debug("Route preview failed", e, "warning");
          setMapMeta(`Route preview failed: ${e?.error || "request failed"}`);
        }
      }

      function schedulePreviewRoute() {
        window.clearTimeout(previewTimer);
        previewTimer = window.setTimeout(previewRoute, 450);
      }

      function updateMapMeta() {
        const currentGps = toLatLng(lastStatus?.currentGps);
        const destinationText = $("destination").value.trim() || "unset";
        const originText = $("origin").value.trim() || "current GPS";
        const routeLabel = lastStatus?.pendingRoute || lastStatus?.currentRoute || "route";
        const gpsLabel = currentGps && lastStatus?.currentGps ? `current ${pointText(lastStatus.currentGps)}` : "current location unavailable";
        mapMetaEl.innerHTML = `
          <span>${routeLabel}</span>
          <span>origin ${originText}</span>
          <span>destination ${destinationText}</span>
          <span>${gpsLabel}</span>
        `;
      }

      function updateMap(status) {
        ensureMap();
        if (!map) {
          setMapMeta(status?.hasApiKey ? "Loading Google Maps..." : "Save API key to load Google Maps.");
          return;
        }

        const currentGps = toLatLng(status?.currentGps);
        if (!routeLine) {
          if (currentMarker) {
            currentMarker.setMap(null);
            currentMarker = null;
          }
          if (currentGps) {
            currentMarker = makeEndpointMarker("origin", currentGps);
          }
        }

        if (!destinationMarker) {
          const destination = waypointLatLng(status?.pendingDestinationWaypoint) || parseLatLngText(status?.pendingDestination);
          if (destination) {
            destinationMarker = makeEndpointMarker("destination", destination, true);
            destinationMarker.addListener("dragend", updateDestinationField);
            $("destination").value = `${destination.lat.toFixed(6)},${destination.lng.toFixed(6)}`;
          }
        }

        const encodedPolyline = status?.pendingEncodedPolyline;
        if (encodedPolyline) {
          renderEncodedRoute(encodedPolyline);
        } else {
          schedulePreviewRoute();
        }

        const layers = [];
        if (currentGps) {
          layers.push(currentGps);
        }
        if (destinationMarker) {
          const destinationPosition = markerPosition(destinationMarker);
          if (destinationPosition) {
            layers.push(destinationPosition);
          }
        }
        if (routeLine) {
          fitMap(routeLine.getPath().getArray());
        } else if (layers.length) {
          if (currentGps && layers.length === 1) {
            map.setCenter(currentGps);
            map.setZoom(Math.max(map.getZoom() || 16, 16));
          } else {
            fitMap(layers);
          }
        }

        updateMapMeta();
      }

      async function request(path, options = {}) {
        const response = await fetch(path, {
          headers: {"Content-Type": "application/json"},
          ...options,
        });
        const text = await response.text();
        let body;
        try {
          body = text ? JSON.parse(text) : {};
        } catch {
          body = {raw: text};
        }
        if (!response.ok) {
          throw body;
        }
        return body;
      }

      async function refresh() {
        try {
          const body = await request("/status");
          lastStatus = body;
          show(body, true);
          debug("Status refreshed", {
            hasApiKey: body.hasApiKey,
            hasPendingNavigation: body.hasPendingNavigation,
            currentRoute: body.currentRoute,
            hasCurrentGps: Boolean(body.currentGps),
          });
          if (body.hasApiKey && !window.google?.maps && !$("apiKey").value.trim()) {
            try {
              const keyBody = await request("/maps_api_key");
              await loadGoogleMaps(keyBody.apiKey);
            } catch (e) {
              debug("Saved API key could not load Google Maps", e, "error");
            }
          }
          updateMap(body);
        } catch (e) {
          debug("Status refresh failed", e, "error");
          show(e, false);
        }
      }

      $("saveKey").addEventListener("click", async () => {
        setBusy(true);
        try {
          const apiKey = $("apiKey").value.trim();
          await request("/api_key", {method: "POST", body: JSON.stringify({apiKey})});
          await loadGoogleMaps(apiKey);
          await refresh();
          show("API key saved. Google map loaded; click the map or enter a destination.", true);
        } catch (e) {
          debug("Save API key failed", e, "error");
          show(e, false);
        } finally {
          setBusy(false);
        }
      });

      $("start").addEventListener("click", async () => {
        setBusy(true);
        try {
          const destination = parseDestination($("destination").value);
          const apiKey = $("apiKey").value.trim();
          debug("Planning route for recording", {
            destinationType: typeof destination === "string" ? "address" : destination ? "latLng" : "missing",
            originOverride: Boolean($("origin").value.trim()),
          });
          const body = await request("/route", {
            method: "POST",
            body: JSON.stringify({
              apiKey: apiKey || null,
              origin: $("origin").value || null,
              destination,
              avoid: {
                tolls: $("avoidTolls").checked,
                highways: $("avoidHighways").checked,
                ferries: $("avoidFerries").checked,
              },
            }),
          });
          debug("Route planned for recording", {
            hasPolyline: Boolean(body.encodedPolyline),
            distanceMeters: body.distanceMeters,
            duration: body.duration,
            stepCount: body.stepCount,
          });
          if (body.encodedPolyline && map) {
            renderEncodedRoute(body.encodedPolyline);
          }
          show(body, true);
          await refresh();
        } catch (e) {
          debug("Route planning failed", e, "error");
          show(e, false);
        } finally {
          setBusy(false);
        }
      });

      $("clearNav").addEventListener("click", async () => {
        setBusy(true);
        try {
          const body = await request("/clear_nav", {method: "POST", body: "{}"});
          show(body, true);
          clearRouteOverlay();
          clearPreviewRoute();
          await refresh();
        } catch (e) {
          debug("Clear pending navigation failed", e, "error");
          show(e, false);
        } finally {
          setBusy(false);
        }
      });

      refresh();
      $("destination").addEventListener("input", schedulePreviewRoute);
      $("origin").addEventListener("input", schedulePreviewRoute);
      ["avoidTolls", "avoidHighways", "avoidFerries"].forEach((id) => {
        $(id).addEventListener("change", schedulePreviewRoute);
      });
      setInterval(() => {
        if (lastStatus && (lastStatus.hasPendingNavigation || lastStatus.currentRoute || lastStatus.currentGps)) {
          refresh();
        }
      }, MAP_REFRESH_MS);

      window.addEventListener("error", (event) => {
        debug("Unhandled browser error", {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
        }, "error");
      });
      window.addEventListener("unhandledrejection", (event) => {
        debug("Unhandled promise rejection", event.reason, "error");
      });
    </script>
  </body>
</html>
