<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shadow Mode</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #14161a; }
      main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
      section { background: white; border: 1px solid #d8dde3; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; }
      .card { flex: 1 1 280px; background: #fbfcfd; border: 1px solid #e2e7ee; border-radius: 10px; padding: 14px; }
      .label { color: #66707a; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
      .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #e8edf3; color: #2b3641; font-size: 12px; font-weight: 700; }
      .ok { background: #d8f3e3; color: #126e5c; }
      .bad { background: #fee3e3; color: #9f1c1c; }
      input[type=file], textarea, button { width: 100%; font: inherit; }
      textarea { min-height: 120px; }
      button { min-height: 44px; border: 0; border-radius: 8px; background: #126e5c; color: white; font-weight: 700; }
      button.secondary { background: #2f3b45; }
      button.danger { background: #9f1c1c; }
      pre { margin: 0; white-space: pre-wrap; }
      .muted { color: #66707a; }
      .small { font-size: 13px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <h1>Shadow Mode</h1>
      <p class="muted">Upload ONNX on the device. The backend runs inference. This page only displays decoded outputs and actuals.</p>
      <p><span id="conn" class="pill">connecting...</span> <span id="vaeState" class="pill">vae not loaded</span> <span id="runstate" class="pill">idle</span> <span id="fresh" class="pill">no sample yet</span></p>

      <section>
        <input id="model" type="file" accept=".onnx">
        <button id="upload">Upload Policy Model</button>
      </section>

      <section>
        <input id="vae" type="file" accept=".onnx">
        <button id="uploadVae">Upload VAE Model</button>
      </section>

      <section>
        <div class="row">
          <button id="start" class="secondary">Start Backend Inference</button>
          <button id="stop" class="danger">Stop Backend Inference</button>
        </div>
        <p class="small muted" id="runtime">Backend inference is stopped.</p>
      </section>

      <section>
        <div class="row">
          <div class="card">
            <div class="label">Actual</div>
            <div class="value" id="actual">-</div>
          </div>
          <div class="card">
            <div class="label">Predicted</div>
            <div class="value" id="predicted">-</div>
          </div>
        </div>
      </section>

      <section>
        <div class="label">Status</div>
        <pre id="status">Waiting for model upload...</pre>
      </section>

    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      async function request(path, options = {}) {
        const res = await fetch(path, {headers: {"Content-Type": "application/json"}, ...options});
        const text = await res.text();
        const body = text ? JSON.parse(text) : {};
        if (!res.ok) throw body;
        return body;
      }
      function render(body) {
        $("status").textContent = JSON.stringify(body, null, 2);
        $("conn").textContent = body.modelReady ? "policy loaded" : (body.hasModelFile ? "policy loading" : "waiting for policy");
        $("conn").className = body.modelReady ? "pill ok" : "pill bad";
        $("vaeState").textContent = body.vaeReady ? "vae loaded" : (body.hasVaeFile ? "vae loading" : "vae not loaded");
        $("vaeState").className = body.vaeReady ? "pill ok" : "pill";
        $("runstate").textContent = body.lastPolicyError ? "inference error" : (body.running ? "backend running" : (body.inferenceEnabled ? "starting" : "stopped"));
        $("runstate").className = body.lastPolicyError ? "pill bad" : (body.running ? "pill ok" : "pill");
        const age = body.liveTimestamp ? Math.max(0, (Date.now() / 1000) - body.liveTimestamp).toFixed(1) : null;
        $("fresh").textContent = age == null ? "no sample yet" : `sample age ${age}s`;
        $("fresh").className = age != null && age < 2 ? "pill ok" : "pill bad";
        $("actual").textContent = body.actual ? `speed ${body.actual.speed ?? 0}, throttle ${body.actual.throttle ?? 0}, brake ${body.actual.brake ?? 0}, steering ${body.actual.steering ?? 0}` : "-";
        $("predicted").textContent = body.predicted ? `${body.predicted.pedal_state?.name || "-"} | throttle ${body.predicted.throttle ?? 0}, brake ${body.predicted.brake ?? 0}, steering ${body.predicted.steering ?? 0}` : "-";
        const policyAge = body.lastPolicyRunTime ? `${Math.max(0, (Date.now() / 1000) - body.lastPolicyRunTime).toFixed(1)}s ago` : "never";
        const vaeAge = body.lastVaeRunTime ? `${Math.max(0, (Date.now() / 1000) - body.lastVaeRunTime).toFixed(1)}s ago` : "never";
        const policyMs = Number(body.lastPolicyDurationMs || 0).toFixed(1);
        const vaeMs = Number(body.lastVaeDurationMs || 0).toFixed(1);
        $("runtime").textContent = `enabled=${!!body.inferenceEnabled}, running=${!!body.running}, policy runs=${body.policyRunCount ?? 0} (${policyAge}, ${policyMs}ms), vae runs=${body.vaeRunCount ?? 0} (${vaeAge}, ${vaeMs}ms), policy errors=${body.policyErrorCount ?? 0}, vae errors=${body.vaeErrorCount ?? 0}`;
      }
      $("upload").addEventListener("click", async () => {
        const file = $("model").files[0];
        if (!file) return;
        const buf = await file.arrayBuffer();
        $("status").textContent = "Uploading model...";
        try {
          const res = await fetch("/shadow/upload", {method: "POST", body: buf});
          const body = await res.json();
          render(body.status || body);
          if (!res.ok) throw body;
        } catch (e) {
          $("status").textContent = JSON.stringify(e, null, 2);
          $("runstate").textContent = "upload failed";
          $("runstate").className = "pill bad";
        }
      });
      $("uploadVae").addEventListener("click", async () => {
        const file = $("vae").files[0];
        if (!file) return;
        const buf = await file.arrayBuffer();
        $("status").textContent = "Uploading VAE...";
        try {
          const res = await fetch("/shadow/upload_vae", {method: "POST", body: buf});
          const body = await res.json();
          render(body.status || body);
          if (!res.ok) throw body;
        } catch (e) {
          $("status").textContent = JSON.stringify(e, null, 2);
          $("vaeState").textContent = "vae upload failed";
          $("vaeState").className = "pill bad";
        }
      });
      $("start").addEventListener("click", async () => {
        $("status").textContent = "Starting backend inference...";
        try {
          const body = await request("/shadow/start", {method: "POST"});
          render(body.status || body);
        } catch (e) {
          $("status").textContent = JSON.stringify(e, null, 2);
          $("runstate").textContent = "start failed";
          $("runstate").className = "pill bad";
        }
      });
      $("stop").addEventListener("click", async () => {
        $("status").textContent = "Stopping backend inference...";
        try {
          const body = await request("/shadow/stop", {method: "POST"});
          render(body.status || body);
        } catch (e) {
          $("status").textContent = JSON.stringify(e, null, 2);
          $("runstate").textContent = "stop failed";
          $("runstate").className = "pill bad";
        }
      });
      async function refresh() {
        try {
          render(await request("/shadow/status"));
        } catch (e) {
          $("status").textContent = JSON.stringify(e, null, 2);
          $("conn").textContent = "backend unavailable";
          $("conn").className = "pill bad";
          $("runstate").textContent = "offline";
          $("runstate").className = "pill bad";
        }
      }
      setInterval(refresh, 1000);
      refresh();
    </script>
  </body>
</html>
